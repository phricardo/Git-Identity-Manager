[package]
name = "git-identity-manager"
version = "0.1.0"
description = "Desktop app for managing Git identities and GitHub CLI accounts."
authors = ["Git Identity Manager Contributors"]
edition = "2021"
rust-version = "1.78"

[lib]
name = "git_identity_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
