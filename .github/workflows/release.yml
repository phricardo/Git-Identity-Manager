name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    if: startsWith(github.event.release.name, 'v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"

          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag '$tag' must match vX.Y.Z, for example v1.0.1."
          }

          $version = $tag.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Write release version config
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          "{ `"version`": `"$version`" }" | Set-Content -Path src-tauri/tauri.release.conf.json -Encoding UTF8

      - name: Build and upload Windows release assets
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.release.conf.json
          assetNamePattern: "[name]_[version]_[platform]_[arch][_setup][ext]"
          retryAttempts: 2

  build-linux-deb:
    name: Build Linux Debian package
    runs-on: ubuntu-22.04
    if: startsWith(github.event.release.name, 'v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$tag' must match vX.Y.Z, for example v1.0.1." >&2
            exit 1
          fi

          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Write release version config
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          cat > src-tauri/tauri.release.conf.json <<EOF
          { "version": "$version", "build": { "beforeBuildCommand": "npm run build" }, "bundle": { "icon": ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.png"] } }
          EOF

      - name: Build and upload Linux Debian release assets
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          tauriScript: npm run tauri
          args: --bundles deb --config src-tauri/tauri.release.conf.json
          assetNamePattern: "[name]_[version]_[platform]_[arch][_setup][ext]"
          retryAttempts: 2
